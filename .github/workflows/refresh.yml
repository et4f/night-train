# 每日更新时刻表
#
# 每天北京时间 06:00 触发，随后在 0–30 分钟内随机等待再开抓，
# 所以实际开始时间落在 06:00–06:30 之间（抓取本身约 4–10 分钟）。
# 随机是为了不形成固定的请求时间点，也让每天的负载分散开。
#
# 也可以在 Actions 页面手动点「Run workflow」。
#
# 若某天 12306 抽风，会在「抓车次索引」一步失败并停下，
# 仓库和线上站点保持上一次的数据，不会写进坏数据。

name: 每日更新时刻表

on:
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = 北京时间 06:00，具体开始时间由下面的随机等待决定
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 随机等待最多 30 分钟 + 抓取约 15 分钟
    steps:
      - name: 随机等待（仅定时任务，手动触发不等）
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1800))
          echo "随机等待 ${DELAY} 秒（约 $((DELAY / 60)) 分 $((DELAY % 60)) 秒）"
          sleep "$DELAY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 探测 12306 可达性
        continue-on-error: true
        run: |
          echo "search.12306.cn:"
          curl -s -o /dev/null -w "  HTTP %{http_code}\n" --max-time 20 \
            "https://search.12306.cn/search/v1/train/search?keyword=Z&date=$(date -u +%Y%m%d)&from_station=&to_station=" || true
          echo "kyfw.12306.cn:"
          curl -s -o /dev/null -w "  HTTP %{http_code}\n" --max-time 20 \
            "https://kyfw.12306.cn/otn/resources/js/framework/station_name.js" || true

      - name: 抓车次索引
        run: node scripts/01-fetch-index.mjs

      - name: 抓经停时刻表
        run: node scripts/02-fetch-schedules.mjs

      - name: 合成数据集
        run: node scripts/03-build.mjs

      - name: 重建 docs/
        run: node scripts/07-build-docs.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 更新 12306 时刻表 ($(date -u +%F))"
            git push
          fi
