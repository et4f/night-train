# 每日更新（在本机运行）
#
# 为什么不放在 GitHub Actions 上：
#   12306 会拒绝境外机房 IP —— 实测用境外中转拉 12306 接口一律返回 522，
#   GitHub 的 runner 在美国/欧洲，抓不到任何数据。
#   所以定时抓取改由本机（国内 IP）跑：scripts/daily-refresh.bat，
#   由 Windows 计划任务「夜宿火车每日更新」每天 06:30 触发。
#
# 这个工作流保留下来只为「手动在云端试跑」用（workflow_dispatch），
# 不再设 schedule，避免每天出现一个失败的红叉。

name: 云上手动更新（可能被 12306 拦截）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 探测 12306 可达性
        continue-on-error: true
        run: |
          echo "search.12306.cn:"
          curl -s -o /dev/null -w "  HTTP %{http_code}\n" --max-time 20 \
            "https://search.12306.cn/search/v1/train/search?keyword=Z&date=$(date -u +%Y%m%d)&from_station=&to_station=" || true
          echo "kyfw.12306.cn:"
          curl -s -o /dev/null -w "  HTTP %{http_code}\n" --max-time 20 \
            "https://kyfw.12306.cn/otn/resources/js/framework/station_name.js" || true

      - name: 抓车次索引
        run: node scripts/01-fetch-index.mjs

      - name: 抓经停时刻表
        run: node scripts/02-fetch-schedules.mjs

      - name: 合成数据集
        run: node scripts/03-build.mjs

      - name: 重建 docs/
        run: node scripts/07-build-docs.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.json docs
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 更新 12306 时刻表 ($(date -u +%F))"
            git push
          fi
