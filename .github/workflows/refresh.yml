name: 每日更新时刻表

# 每天北京时间 06:17 抓一次 12306，重建 docs/ 并提交，Pages 会自动重新发布。
# 也可以在 Actions 页面手动点「Run workflow」。
on:
  schedule:
    - cron: '17 22 * * *' # UTC 22:17 = 北京时间 06:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓车次索引
        run: node scripts/01-fetch-index.mjs

      - name: 抓经停时刻表（约 2 分钟）
        run: node scripts/02-fetch-schedules.mjs

      - name: 合成数据集
        run: node scripts/03-build.mjs

      - name: 重建 docs/
        run: node scripts/07-build-docs.mjs

      - name: 提交变更
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.json docs
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: 每日更新 12306 时刻表 ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 可选：把快照推到 Cloudflare KV，页面打开就能直接读
      - name: 推送快照到 KV
        if: steps.commit.outputs.changed == 'true' && vars.NIGHT_API != ''
        continue-on-error: true
        env:
          NIGHT_API: ${{ vars.NIGHT_API }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          curl -sS -X POST "$NIGHT_API/snapshot?key=$SYNC_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @data/app.json
