# 每日更新时刻表
#
# 每天北京时间 06:17 自动抓一次 12306，重建 docs/ 并提交，Pages 会自动重新发布。
# 也可以在 Actions 页面手动点「Run workflow」。
#
# 实测（2026-11-13）：GitHub 的 runner 访问 12306 正常，
# 抓 1267 趟车的索引约 20 秒，1186 份时刻表约 3 分钟，全程 4 分钟出头。
# 若某天 12306 抽风，会在「抓车次索引」一步失败并停下，
# 仓库和线上站点保持上一次的数据，不会写进坏数据。

name: 每日更新时刻表

on:
  schedule:
    - cron: '17 22 * * *' # UTC 22:17 = 北京时间 06:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 探测 12306 可达性
        continue-on-error: true
        run: |
          echo "search.12306.cn:"
          curl -s -o /dev/null -w "  HTTP %{http_code}\n" --max-time 20 \
            "https://search.12306.cn/search/v1/train/search?keyword=Z&date=$(date -u +%Y%m%d)&from_station=&to_station=" || true
          echo "kyfw.12306.cn:"
          curl -s -o /dev/null -w "  HTTP %{http_code}\n" --max-time 20 \
            "https://kyfw.12306.cn/otn/resources/js/framework/station_name.js" || true

      - name: 抓车次索引
        run: node scripts/01-fetch-index.mjs

      - name: 抓经停时刻表
        run: node scripts/02-fetch-schedules.mjs

      - name: 合成数据集
        run: node scripts/03-build.mjs

      - name: 重建 docs/
        run: node scripts/07-build-docs.mjs

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.json docs
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: 更新 12306 时刻表 ($(date -u +%F))"
            git push
          fi
