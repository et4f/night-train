name: 部署到 Cloudflare Pages

# 国内访问 github.io 慢，这里把 docs/ 同步一份到 Cloudflare Pages。
# 需要在仓库设置里加两个 Secret：
#   CLOUDFLARE_API_TOKEN   （Cloudflare → 我的个人资料 → API 令牌 → 创建「Cloudflare Pages:编辑」）
#   CLOUDFLARE_ACCOUNT_ID  （Cloudflare 控制台右侧栏的 Account ID）
# 没配也不会报错，脚本会直接跳过。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 推送到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过 Cloudflare 部署"
            exit 0
          fi
          npx --yes wrangler@latest pages deploy docs \
            --project-name=night-train \
            --branch=main \
            --commit-dirty=true
